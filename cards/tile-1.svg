<svg xmlns="http://www.w3.org/2000/svg" width="270" height="120" viewBox="0 0 270 120" role="img" aria-labelledby="t d"><title id="t">Repositories</title><desc id="d">What I have published</desc><defs><style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(data:font/woff;base64,) format('woff')}.sans{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(12px)}}.a-rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}@keyframes trace{0%{stroke-dashoffset:1;opacity:1}65%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.a-trace{animation:trace 1.7s ease-in-out both}.d700{animation-delay:700ms}.d850{animation-delay:850ms}.d950{animation-delay:950ms}.d1050{animation-delay:1050ms}.d1100{animation-delay:1100ms}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style></defs><rect x=".5" y=".5" width="269" height="119" rx="16" fill="#171A24" stroke="#2A2E3D"/><rect x=".75" y=".75" width="268.5" height="118.5" rx="15.25" fill="none" stroke="#FF6B3D" stroke-width="1.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" opacity="0" class="a-trace d700"/><text x="22" y="33" class="mono a-rise d850" font-size="12" font-weight="400" fill="#A3A1AE">01</text><text x="22" y="72" class="sans a-rise d950" font-size="25" font-weight="700" fill="#F5F0E8">Repositories</text><text x="22" y="98" class="mono a-rise d1050" font-size="12" font-weight="400" fill="#A3A1AE">What I have published</text><path d="M228 38L242 24M231 24H242V35" fill="none" stroke="#FF6B3D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="a-rise d1100"/></svg>
