<svg xmlns="http://www.w3.org/2000/svg" width="830" height="336" viewBox="0 0 830 336" role="img" aria-labelledby="t d"><title id="t">Contributions per month</title><desc id="d">Bar chart of contributions per month for the last 12 months, with streaks.</desc><defs><style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(data:font/woff;base64,) format('woff')}.sans{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif}.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(12px)}}.a-rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}@keyframes trace{0%{stroke-dashoffset:1;opacity:1}65%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.a-trace{animation:trace 1.7s ease-in-out both}.d1400{animation-delay:1400ms}.d1500{animation-delay:1500ms}.d1600{animation-delay:1600ms}.d2000{animation-delay:2000ms}.d2050{animation-delay:2050ms}.d2100{animation-delay:2100ms}.d2120{animation-delay:2120ms}.d2170{animation-delay:2170ms}.d2220{animation-delay:2220ms}.d2240{animation-delay:2240ms}.d2290{animation-delay:2290ms}.d2340{animation-delay:2340ms}.d2360{animation-delay:2360ms}.d2410{animation-delay:2410ms}.d2460{animation-delay:2460ms}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style></defs><rect x=".5" y=".5" width="829" height="335" rx="20" fill="#171A24" stroke="#2A2E3D"/><rect x=".75" y=".75" width="828.5" height="334.5" rx="19.25" fill="none" stroke="#FF6B3D" stroke-width="1.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" opacity="0" class="a-trace d1400"/><text x="44" y="58" class="sans a-rise d1500" font-size="24" font-weight="700" fill="#F5F0E8">Contributions per month</text><text x="44" y="82" class="mono a-rise d1600" font-size="13" font-weight="400" fill="#A3A1AE">Waiting for the first data refresh</text><line x1="92" y1="272" x2="500" y2="272" stroke="#242838" stroke-width="1"/><text x="80" y="276" class="mono a-rise d1600" font-size="11" font-weight="400" fill="#A3A1AE" text-anchor="end">0</text><line x1="92" y1="128" x2="500" y2="128" stroke="#242838" stroke-width="1"/><text x="80" y="132" class="mono a-rise d1600" font-size="11" font-weight="400" fill="#A3A1AE" text-anchor="end">1</text><line x1="528" y1="120" x2="528" y2="296" stroke="#242838"/><text x="556" y="126" class="mono a-rise d2000" font-size="12" font-weight="400" fill="#A3A1AE">Current streak</text><text x="556" y="170" class="sans a-rise d2050" font-size="40" font-weight="700" fill="#F5F0E8">0</text><text x="556" y="192" class="mono a-rise d2100" font-size="12" font-weight="400" fill="#A3A1AE">days</text><text x="680" y="126" class="mono a-rise d2120" font-size="12" font-weight="400" fill="#A3A1AE">Longest streak</text><text x="680" y="170" class="sans a-rise d2170" font-size="40" font-weight="700" fill="#F5F0E8">0</text><text x="680" y="192" class="mono a-rise d2220" font-size="12" font-weight="400" fill="#A3A1AE">days</text><text x="556" y="226" class="mono a-rise d2240" font-size="12" font-weight="400" fill="#A3A1AE">Active days</text><text x="556" y="270" class="sans a-rise d2290" font-size="40" font-weight="700" fill="#F5F0E8">0</text><text x="556" y="292" class="mono a-rise d2340" font-size="12" font-weight="400" fill="#A3A1AE"></text><text x="680" y="226" class="mono a-rise d2360" font-size="12" font-weight="400" fill="#A3A1AE">Busiest day</text><text x="680" y="270" class="sans a-rise d2410" font-size="40" font-weight="700" fill="#F5F0E8">0</text><text x="680" y="292" class="mono a-rise d2460" font-size="12" font-weight="400" fill="#A3A1AE"></text></svg>
